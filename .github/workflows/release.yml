name: Release

# Push a tag named <package>-v<version> to publish that package to PyPI:
#   pytossinvest-sdk-v1.2.3   or   pytossinvest-mcp-v1.2.3
# Upload uses PyPI Trusted Publishing (OIDC), so no API token is stored anywhere.
# Procedure and the one-time PyPI setup: docs/wiki/release.md
on:
  push:
    tags:
      - "pytossinvest-sdk-v*"
      - "pytossinvest-mcp-v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # One GitHub environment per package: PyPI refuses two pending publishers that share a
    # repository, workflow and environment.
    environment: ${{ startsWith(github.ref_name, 'pytossinvest-mcp-v') && 'pypi-mcp' || 'pypi' }}
    permissions:
      contents: read
      id-token: write  # lets PyPI verify this run; the only credential involved
    env:
      UV_PYTHON: "3.12"
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Read package and version from the tag
        run: |
          # package = the name on PyPI, directory = where it lives in this repo
          case "$TAG" in
            pytossinvest-sdk-v*) package=pytossinvest-sdk; directory=pytossinvest ;;
            pytossinvest-mcp-v*) package=pytossinvest-mcp; directory=pytossinvest-mcp ;;
            *) echo "unexpected tag: $TAG" >&2; exit 1 ;;
          esac
          version="${TAG#"$package"-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([a-z0-9.]+)?$ ]]; then
            echo "tag does not end in a version: $TAG" >&2; exit 1
          fi
          echo "PACKAGE=$package" >> "$GITHUB_ENV"
          echo "DIRECTORY=$directory" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Tests
        run: uv run --package "$PACKAGE" --extra dev pytest "$DIRECTORY/tests"

      - name: Build
        run: uv build --package "$PACKAGE" --out-dir dist

      - name: Tag must match the built version
        run: ls "dist/${PACKAGE//-/_}-${VERSION}-py3-none-any.whl" "dist/${PACKAGE//-/_}-${VERSION}.tar.gz"

      - name: Publish
        run: uv publish --trusted-publishing always dist/*.whl dist/*.tar.gz
